#
# release-notes.conf — per-repository settings for the release note convention.
#
# Sourced by scripts/release-notes-lib.sh, which both
# scripts/render-release-notes.sh and scripts/check-release-notes.sh load.
# This is the only file you edit when lifting the convention into another
# repository; the scripts themselves stay repository-agnostic.
# See docs/release-notes-convention.md.
#

# owner/repo, used to build the changelog link. Leave empty to derive it from
# the `origin` remote (works for both git@github.com:... and https://... ).
# Pin it once notes are published — see docs/release-notes-convention.md.
REPO_SLUG="yuzio-ai/veyra"

# Product name substituted into {{PRODUCT}} placeholders in the template.
# Empty = the repository name from REPO_SLUG, used verbatim — set it explicitly
# if your product is cased differently.
PRODUCT_NAME="Veyra"

# Where the canonical notes live, relative to the repository root.
NOTES_DIR="docs/releases"

# The release download. The name must not carry the version — the convention
# forbids every "<name>-<digit>" variant of it.
ASSET_NAME="Veyra.zip"

# Language blocks, in the order they must appear in a note.
#
#   * two or more entries  → the note carries a nav line, one <a id> anchor and
#     one "## <heading>" per language, and each block closes with its own
#     changelog line;
#   * exactly one entry    → no nav line, no anchors, no "## " headings: the
#     note is just sections plus one closing changelog line.
#
# Fields, pipe separated:
#   1. log id       short prefix used in the checker's messages
#   2. anchor id    target of <a id="..."> and of the nav line's href
#   3. heading      text of the "## " heading
#   4. marker       literal start of the closing changelog line, URL excluded
#   5. vocabulary   section names, comma separated, in the only allowed order
#   6. required     indexes into that vocabulary (0 based) that must be present
#
# All six fields are required. In a single-language configuration fields 2 and 3
# are inert, but writing them keeps the entry correct if you ever add a second
# language.
LANGUAGES=(
  'en|english|English|**Full changelog**: |New,Changed,Fixed,How it works,Engineering,Known limitations,Requirements,Installation|6,7'
  'zh|简体中文|简体中文|**完整变更**：|新增,变更,修复,实现方式,工程质量,已知限制,系统要求,安装|6,7'
)
